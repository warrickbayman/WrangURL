name: WrangURL
options:
  bundleIdPrefix: com.thepublicgood
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WrangURL:
    type: application
    platform: macOS
    sources:
      - path: WrangURL
        excludes:
          - Info.plist
          - WrangURL.entitlements
    info:
      path: WrangURL/Info.plist
      properties:
        CFBundleDisplayName: WrangURL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.thepublicgood.wrangurl.browser
            UTTypeDescription: WrangURL Browser
            UTTypeConformsTo: [public.data]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [public.html, public.xhtml]
    entitlements:
      path: WrangURL/WrangURL.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Import and export of the configuration via open/save panels.
        com.apple.security.files.user-selected.read-write: true
        # Read browsers installed per-user in ~/Applications (Developer ID only; not allowed on the App Store).
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Applications/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thepublicgood.wrangurl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ad-hoc signing for local development; switch to Developer ID for distribution.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Release:
          # Notarization rejects the debugging entitlement Xcode adds by default.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  WrangURLTests:
    type: bundle.unit-test
    platform: macOS
    sources: [WrangURLTests]
    dependencies:
      - target: WrangURL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thepublicgood.wrangurl.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  WrangURL:
    build:
      targets:
        WrangURL: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [WrangURLTests]
