name: WrangURL
options:
  bundleIdPrefix: com.thepublicgood
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WrangURL:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: WrangURL
        excludes:
          - Info.plist
          - WrangURL.entitlements
    info:
      path: WrangURL/Info.plist
      properties:
        CFBundleDisplayName: WrangURL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.thepublicgood.wrangurl.browser
            UTTypeDescription: WrangURL Browser
            UTTypeConformsTo: [public.data]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [public.html, public.xhtml]
        # Sparkle updates. The feed is attached to each GitHub release by .github/workflows/release.yml;
        # "latest/download" always resolves to the newest non-prerelease.
        SUFeedURL: https://github.com/warrickbayman/WrangURL/releases/latest/download/appcast.xml
        SUPublicEDKey: nhut+67ccREm92IqayuzOH6bPokUPwdMbBxiY47jL2w=
        # Sandboxed apps must install updates through Sparkle's installer XPC service.
        SUEnableInstallerLauncherService: true
    entitlements:
      path: WrangURL/WrangURL.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Import and export of the configuration via open/save panels.
        com.apple.security.files.user-selected.read-write: true
        # Read browsers installed per-user in ~/Applications (Developer ID only; not allowed on the App Store).
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Applications/
        # Builds without an Apple Team ID (ad-hoc or self-signed; see scripts/resign.sh) can't load
        # the embedded Sparkle.framework under the hardened runtime's library validation.
        com.apple.security.cs.disable-library-validation: true
        # Sparkle fetches the update feed and archive.
        com.apple.security.network.client: true
        # Lets Sparkle talk to its installer, which runs outside the sandbox.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thepublicgood.wrangurl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ad-hoc signing for local development; switch to Developer ID for distribution.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Release:
          # Notarization rejects the debugging entitlement Xcode adds by default.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  WrangURLTests:
    type: bundle.unit-test
    platform: macOS
    sources: [WrangURLTests]
    dependencies:
      - target: WrangURL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thepublicgood.wrangurl.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  WrangURL:
    build:
      targets:
        WrangURL: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [WrangURLTests]
